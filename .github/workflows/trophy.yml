name: 🏆 Update GitHub Trophies

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🏆 Generate GitHub Trophy
        uses: soulteary/github-profile-trophy-action@v1.0.0
        with:
          options: 'username=SANJAYKUMAR-05&theme=darkhub&column=7&margin-w=15&margin-h=15&no-bg=true&no-frame=true&rank=SECRET'
          path: profile/trophy.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Commit Trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/trophy.svg

          git commit -m "🏆 Update GitHub trophies" || exit 0

          git push
